name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "templates/**"
      - "static/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Build Windows application
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name AI-GeoFinder --add-data "templates;templates" --add-data "static;static" app.py
      - name: Include setup instructions
        run: |
          Copy-Item README.md dist/AI-GeoFinder/README.txt
          Copy-Item .env.example dist/AI-GeoFinder/.env.example
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-GeoFinder-Windows
          path: dist/AI-GeoFinder/
          if-no-files-found: error
          retention-days: 30
